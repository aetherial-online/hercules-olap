[package]
name = "hercules-olap"
version = "0.1.0"
edition = "2024"
description = "High-throughput, pure-Rust columnar OLAP & real-time telemetry database engine"
license = "AGPL-3.0-or-later"
repository = "https://github.com"

[dependencies]
tokio = { version = "1.43", features = ["full"] }
axum = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dashmap = "6.1"
uuid = { version = "1.11", features = ["v4"] }
chrono = "0.4"
bytes = "1.9"
url = "2.5"
futures = "0.3"

# Apache Arrow, Parquet, DataFusion & Object Store (Pure Rust)
arrow = { version = "54.2", features = ["json", "prettyprint"] }
parquet = { version = "54.2", features = ["arrow", "async", "zstd"] }
datafusion = "45.0"
object_store = { version = "0.11", features = ["aws"] }

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
opt-level = 3
